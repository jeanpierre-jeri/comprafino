name: Manual Plaza Vea ingestion
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum listings (1–500; dairy and eggs only)
        default: "20"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ingest-plaza-vea
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrape:plaza-vea -- --limit="$INGEST_LIMIT"
        env:
          INGEST_LIMIT: ${{ inputs.limit }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
