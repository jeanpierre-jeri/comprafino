name: Catalog health
on:
  schedule:
    - cron: "29 2,8,14,20 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comprafino-catalog-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm health:catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
