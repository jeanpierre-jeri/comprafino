name: Catalog refresh
on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comprafino-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire catalog data
        id: acquisition
        shell: bash
        run: pnpm refresh:catalog | tee "$RUNNER_TEMP/catalog-acquisition.log"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Inspect catalog health and capacity skips
        if: ${{ !cancelled() && steps.acquisition.outcome != 'skipped' }}
        run: pnpm health:catalog -- --acquisition-log="$RUNNER_TEMP/catalog-acquisition.log"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
